org.gradle.daemon=false
org.gradle.jvmargs=-Xms512M -Xmx2G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
org.gradle.configureondemand=false
org.gradle.logging.level=quiet

# Timeouts
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
org.gradle.caching=false

# VERSIONS CORREGIDAS - USA VERSIONES COMPATIBLES
kotlinVersion=1.9.0
gdxVersion=1.12.1
projectVersion=1.0.0

# Otras versiones (comentadas si no las usas)
artemisOdbVersion=2.3.0
lmlVersion=1.10.1.12.1
gdxBasisUniversalVersion=1.0.2
controllerMappingVersion=2.3.0
gdxControllersVersion=2.2.3
graalHelperVersion=2.0.1
enableGraalNative=false

android.useAndroidX=true
android.enableR8.fullMode=false
